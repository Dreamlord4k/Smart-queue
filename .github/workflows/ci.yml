# Скелет CI из T-014: backend- и frontend-проверки на push/PR в main.
# Секретов здесь нет: DB_URL и JWT_SECRET ниже — заведомо тестовые
# значения только для CI-прогона, не боевые секреты.

name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-dummy-not-a-secret
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Apply migrations
        run: alembic -c backend/alembic.ini upgrade head
      - name: Validate compose configuration
        env:
          DOMAIN: queue.example.edu
          LETSENCRYPT_EMAIL: ci@example.edu
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f scripts/deploy/docker-compose.https.yml config --quiet
      - name: Backend tests
        run: python -m pytest -q -p no:cacheprovider tests
      - name: Full compose smoke test
        run: |
          unset DB_URL JWT_SECRET
          docker compose up --build --detach --wait
          curl --fail --silent http://localhost/health
          curl --fail --silent http://localhost/api/groups
          curl --fail --silent http://localhost/
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --http1.1 --header 'Connection: Upgrade' --header 'Upgrade: websocket' \
            --header 'Sec-WebSocket-Version: 13' \
            --header 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
            'http://localhost/ws/sessions/00000000-0000-0000-0000-000000000000?token=invalid')" = "403"
      - name: Full compose logs
        if: always()
        run: docker compose logs --tail 20
      - name: Stop full compose
        if: always()
        run: docker compose down --volumes

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --run
      - name: Frontend build
        working-directory: frontend
        run: npm run build
