services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_queue}
      POSTGRES_USER: ${POSTGRES_USER:-smart_queue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_queue}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: ${DB_URL:-postgresql+psycopg://smart_queue:smart_queue@postgres:5432/smart_queue}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
